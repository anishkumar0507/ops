<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nextdot OpsBot</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f5f2;--bg2:#fff;--bg3:#f0efe9;--bg4:#e8e6de;--bg5:#dddbd0;
  --brd:rgba(0,0,0,0.07);--brd2:rgba(0,0,0,0.13);
  --tx:#18170f;--tx2:#5c5948;--tx3:#9c9880;
  --am:#bf6f1f;--am2:#d4831f;--am3:#fef3e2;--am4:#fffbf3;--amd:#6b3900;
  --bl:#1a5a9e;--bl2:#2060b0;--bl3:#edf3fc;--bld:#0c2f5e;
  --gn:#0a7a4a;--gn2:#0d8f56;--gn3:#eafaf2;--gnd:#044d2c;
  --rd:#b83030;--rd2:#cc3535;--rd3:#fdf0f0;--rdd:#6b1414;
  --pu:#5530a8;--pu2:#6d3fc0;--pu3:#f2effd;--pud:#2d1666;
  --tl:#0d6e85;--tl2:#0f82a0;--tl3:#eaf7fb;--tld:#063f4e;
  --or:#c45c0a;--or3:#fef0e6;--ord:#6b2d00;
  --sh:0 2px 8px rgba(0,0,0,0.07),0 1px 3px rgba(0,0,0,0.04);
  --sh2:0 8px 32px rgba(0,0,0,0.1),0 2px 8px rgba(0,0,0,0.06);
  --r:8px;--r2:10px;--r3:12px;
}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;height:100vh;overflow:hidden;font-size:13px;line-height:1.5}
.app{display:flex;height:100vh}

/* SIDEBAR */
.sb{width:222px;min-width:222px;background:var(--bg2);border-right:1px solid var(--brd);display:flex;flex-direction:column;overflow:hidden}
.sb-logo{padding:14px 13px 12px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:8px;flex-shrink:0}
.logo-mk{width:28px;height:28px;background:var(--am);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700;flex-shrink:0;font-family:'DM Mono',monospace}
.logo-t{font-size:13px;font-weight:600;letter-spacing:-0.3px}
.logo-s{font-size:9.5px;color:var(--tx3)}
.fb-ind{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:9px;color:var(--tx3)}
.fb-dot{width:5px;height:5px;border-radius:50%;background:var(--gn2)}
.fb-dot.off{background:var(--rd2)}
.fb-dot.syncing{background:var(--am);animation:fbpulse 1s infinite}
@keyframes fbpulse{0%,100%{opacity:1}50%{opacity:0.4}}
.sb-sec{padding:13px 13px 4px;font-size:9.5px;color:var(--tx3);letter-spacing:1.4px;text-transform:uppercase;font-weight:500;flex-shrink:0}
.ni{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:var(--r);cursor:pointer;font-size:12.5px;color:var(--tx2);transition:all .1s;margin:1px 5px;position:relative}
.ni:hover{background:var(--bg3);color:var(--tx)}
.ni.active{background:var(--am3);color:var(--am);font-weight:500}
.ni svg{flex-shrink:0;opacity:.65}.ni.active svg{opacity:1}
.nbadge{background:var(--am);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:auto;letter-spacing:.2px}
.nbadge.esc{background:var(--rd2);animation:fbpulse 2s infinite}
.sb-projs{flex:1;overflow-y:auto;padding:2px 5px 5px}
.cl-grp{margin-bottom:1px}
.cl-hd{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--tx2);transition:all .1s;user-select:none}
.cl-hd:hover{background:var(--bg3)}.cl-hd.open{color:var(--tx);font-weight:500}
.cl-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cl-arr{margin-left:auto;font-size:8px;color:var(--tx3);transition:transform .15s;line-height:1}
.cl-arr.open{transform:rotate(90deg)}
.cl-projs{padding-left:12px;display:none}.cl-projs.open{display:block}
.pi{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--tx3);transition:all .1s;margin:1px 0}
.pi:hover{color:var(--tx2)}.pi.active{color:var(--am);font-weight:500}
.pdot{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.sb-bot{padding:6px;border-top:1px solid var(--brd);flex-shrink:0}
.u-row{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:var(--r);cursor:pointer;transition:all .1s}
.u-row:hover{background:var(--bg3)}
.uav{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:600;flex-shrink:0}
.uname{font-size:12.5px;font-weight:500;line-height:1.3}
.urole{font-size:10px;color:var(--tx3)}
.so-btn{margin-left:auto;color:var(--tx3);cursor:pointer;padding:3px;border-radius:4px;transition:all .1s;flex-shrink:0}
.so-btn:hover{color:var(--rd2);background:var(--rd3)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:48px;border-bottom:1px solid var(--brd);display:flex;align-items:center;padding:0 20px;gap:10px;background:var(--bg2);flex-shrink:0}
.pg-title{font-size:13px;font-weight:500;flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.pg-sep{color:var(--tx3);font-weight:400}
.pg-sub{color:var(--tx3);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{padding:5px 11px;border-radius:var(--r);font-size:12px;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .1s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;line-height:1.4}
.btn-g{background:transparent;color:var(--tx2);border:1px solid var(--brd2)}.btn-g:hover{background:var(--bg3);color:var(--tx)}
.btn-p{background:var(--am);color:#fff;border:1px solid transparent}.btn-p:hover{background:var(--am2)}
.btn-d{background:transparent;color:var(--rdd);border:1px solid rgba(184,48,48,.25)}.btn-d:hover{background:var(--rd3)}
.ct{flex:1;overflow-y:auto;padding:18px 20px}

/* TAGS */
.tag{padding:2px 7px;border-radius:5px;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.t-urg{background:var(--rd3);color:var(--rdd)}
.t-tod{background:var(--am3);color:var(--amd)}
.t-nor{background:var(--bg3);color:var(--tx2)}
.t-don{background:var(--gn3);color:var(--gnd)}
.t-ov{background:var(--rd3);color:var(--rdd)}
.t-esc{background:var(--or3);color:var(--ord);animation:fbpulse 2s infinite}
.t-inf{background:var(--bl3);color:var(--bld)}

/* STAT CARDS */
.sg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
.sc{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r2);padding:13px 15px;transition:all .1s}
.sc:hover{border-color:var(--brd2);transform:translateY(-1px)}
.sc-l{font-size:9.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;font-weight:500}
.sc-v{font-size:22px;font-weight:600;letter-spacing:-.5px;font-family:'DM Mono',monospace}
.sc-s{font-size:10.5px;color:var(--tx3);margin-top:2px}

/* SECTIONS */
.sh{font-size:9.5px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.9px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sh::after{content:'';flex:1;height:1px;background:var(--brd)}

/* FILTER BAR */
.fbar{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.fb{padding:3px 10px;border-radius:20px;font-size:11.5px;cursor:pointer;border:1px solid var(--brd);background:transparent;color:var(--tx2);font-family:'DM Sans',sans-serif;transition:all .1s}
.fb:hover{border-color:var(--brd2);color:var(--tx)}
.fb.active{background:var(--am3);color:var(--am);border-color:rgba(191,111,31,.3);font-weight:500}
.srch{flex:1;max-width:200px;background:var(--bg3);border:1px solid var(--brd);border-radius:var(--r);padding:4px 10px;color:var(--tx);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .1s}
.srch:focus{border-color:var(--am);background:var(--bg2)}

/* TASK ROWS */
.tl{display:flex;flex-direction:column;gap:3px}
.tr{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:8px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .1s}
.tr:hover{border-color:var(--brd2);background:var(--bg4)}
.tr.is-ov{border-left:2px solid var(--rd2)}
.tr.is-esc{border-left:2px solid var(--or)}
.chk{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--brd2);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s}
.chk:hover{border-color:var(--gn2)}.chk.done{background:var(--gn2);border-color:var(--gn2)}
.chk.done::after{content:'✓';font-size:7px;color:#fff;font-weight:700}
.tm{flex:1;min-width:0}
.tt{font-size:12.5px;font-weight:400}.tt.done{text-decoration:line-through;color:var(--tx3)}
.tdesc{font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tmeta{display:flex;align-items:center;gap:4px;flex-shrink:0;flex-wrap:wrap}
.mav{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:600;flex-shrink:0;border:1px solid transparent}

/* BOARD */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:start}
.bc{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r2);overflow:hidden}
.bc-hd{padding:9px 11px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:6px;background:var(--bg3)}
.bc-n{font-size:10.5px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px}
.bc-c{background:var(--bg4);color:var(--tx3);font-size:9.5px;padding:1px 5px;border-radius:7px;margin-left:auto;font-family:'DM Mono',monospace}
.bc-dz{padding:7px;display:flex;flex-direction:column;gap:4px;min-height:48px;transition:background .1s}
.bc-dz.drag-over{background:var(--am3);border-radius:6px}
.kc{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:9px 10px;cursor:grab;transition:all .1s;user-select:none}
.kc:hover{border-color:var(--brd2);transform:translateY(-1px);box-shadow:var(--sh)}
.kc.dragging{opacity:.3;transform:rotate(1deg)}
.kc.is-ov{border-left:2px solid var(--rd2)}.kc.is-esc{border-left:2px solid var(--or)}
.kc-t{font-size:12px;font-weight:500;line-height:1.4;margin-bottom:5px}
.kc-p{font-size:10.5px;color:var(--tx3);margin-bottom:6px}
.kc-f{display:flex;align-items:center;justify-content:space-between;gap:4px;flex-wrap:wrap}
.add-c{margin:4px 7px 7px;padding:6px;border:1px dashed var(--brd2);border-radius:var(--r);text-align:center;font-size:11.5px;color:var(--tx3);cursor:pointer;transition:all .1s}
.add-c:hover{border-color:var(--am);color:var(--am);background:var(--am3)}

/* CHAT */
.cw{display:flex;flex-direction:column;height:100%;max-width:800px;margin:0 auto;width:100%}
.c-hd{padding-bottom:12px;border-bottom:1px solid var(--brd);display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0}
.c-hd h2{font-size:15px;font-weight:600;letter-spacing:-.2px}
.c-hd p{font-size:11px;color:var(--tx3);margin-top:2px}
.aki-row{display:flex;gap:5px;align-items:center}
.aki{width:190px;background:var(--bg3);border:1px solid var(--brd);border-radius:var(--r);padding:5px 9px;color:var(--tx);font-size:11px;font-family:'DM Mono',monospace;outline:none;transition:border-color .1s}
.aki:focus{border-color:var(--am)}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:14px 0 10px}
.msg{display:flex;gap:8px;align-items:flex-start;position:relative}
.msg:hover .reply-btn{opacity:1}
.reply-btn{opacity:0;position:absolute;right:0;top:50%;transform:translateY(-50%);background:var(--bg2);border:1px solid var(--brd);border-radius:6px;padding:3px 8px;font-size:10px;color:var(--tx2);cursor:pointer;transition:all .1s;display:flex;align-items:center;gap:4px;white-space:nowrap;box-shadow:var(--sh)}
.reply-btn:hover{background:var(--am3);color:var(--am);border-color:rgba(191,111,31,.3)}
.m-av{width:24px;height:24px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:600}
.msg-u .m-av{background:var(--am3);color:var(--amd);border:1px solid rgba(191,111,31,.25)}
.msg-b .m-av{background:var(--bg3);color:var(--tx2);border:1px solid var(--brd)}
.m-bd{flex:1;min-width:0;padding-right:44px}
.m-nm{font-size:9.5px;font-weight:600;color:var(--tx3);margin-bottom:2px;letter-spacing:.3px;text-transform:uppercase}
.m-tx{font-size:12.5px;line-height:1.6;color:var(--tx);white-space:pre-wrap;word-break:break-word}
/* Reply quote bubble inside a message */
.m-quote{background:var(--bg3);border-left:3px solid var(--am);border-radius:6px;padding:5px 9px;margin-bottom:5px;font-size:11.5px;color:var(--tx2);cursor:pointer;transition:background .1s}
.m-quote:hover{background:var(--bg4)}
.m-quote-nm{font-size:9px;font-weight:700;color:var(--am);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.m-quote-tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx3)}
/* Reply preview bar above input */
.reply-bar{display:flex;align-items:center;gap:8px;background:var(--am4);border:1px solid rgba(191,111,31,.2);border-radius:var(--r);padding:6px 10px;margin-bottom:6px;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.reply-bar-line{width:3px;height:100%;background:var(--am);border-radius:2px;flex-shrink:0;align-self:stretch}
.reply-bar-body{flex:1;min-width:0}
.reply-bar-nm{font-size:9px;font-weight:700;color:var(--am);text-transform:uppercase;letter-spacing:.4px;margin-bottom:1px}
.reply-bar-tx{font-size:11.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-bar-x{background:none;border:none;cursor:pointer;color:var(--tx3);font-size:14px;padding:2px 4px;border-radius:4px;transition:all .1s;flex-shrink:0;line-height:1}
.reply-bar-x:hover{color:var(--rd2);background:var(--rd3)}
.ap{background:var(--gn3);border:1px solid rgba(10,122,74,.18);border-radius:var(--r);padding:8px 11px;margin-top:7px;font-size:12px;color:var(--gnd)}
.ap strong{display:block;margin-bottom:4px;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.ep{background:var(--or3);border:1px solid rgba(196,92,10,.2);border-radius:var(--r);padding:8px 11px;margin-top:7px;font-size:12px;color:var(--ord)}
.ep strong{display:block;margin-bottom:3px;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.c-in-wrap{display:flex;flex-direction:column;padding-top:10px;border-top:1px solid var(--brd);flex-shrink:0}
.c-in{display:flex;gap:6px;align-items:flex-end}
.c-ta{flex:1;background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r2);padding:9px 12px;color:var(--tx);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;resize:none;transition:border-color .1s;min-height:40px;max-height:120px;line-height:1.5;overflow-y:auto}
.c-ta:focus{border-color:var(--am)}.c-ta::placeholder{color:var(--tx3)}
.c-sb{width:40px;height:40px;border-radius:var(--r2);background:var(--am);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .1s}
.c-sb:hover{background:var(--am2)}.c-sb:disabled{opacity:.35;cursor:not-allowed}
.dots{display:flex;gap:3px;align-items:center;padding:2px}
.dot{width:4px;height:4px;border-radius:50%;background:var(--am);animation:bns 1s infinite}
.dot:nth-child(2){animation-delay:.16s}.dot:nth-child(3){animation-delay:.32s}
@keyframes bns{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}

/* TEAM */
.teg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tc{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r2);padding:15px;transition:all .1s;position:relative;text-align:center}
.tc:hover{border-color:var(--brd2);transform:translateY(-1px)}
.tav{width:44px;height:44px;border-radius:50%;margin:0 auto 9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;border:2px solid}
.tnm{font-size:13px;font-weight:600;margin-bottom:1px}
.trl{font-size:10.5px;color:var(--tx3);margin-bottom:7px}
.wl-l{font-size:10px;color:var(--tx3);text-align:left;font-family:'DM Mono',monospace;margin-bottom:3px}
.wl-b{height:3px;border-radius:2px;background:var(--bg4);overflow:hidden}
.wl-f{height:100%;border-radius:2px;transition:width .3s}
.tpr{font-size:10px;color:var(--tx3);margin-top:5px;text-align:left}
.xbtn{position:absolute;top:8px;right:8px;background:none;border:none;cursor:pointer;color:var(--tx3);font-size:12px;padding:3px 5px;border-radius:4px;transition:all .1s;line-height:1}
.xbtn:hover{background:var(--rd3);color:var(--rd2)}

/* REPORT */
.rg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r2);padding:15px}
.rc-t{font-size:10px;font-weight:600;color:var(--tx2);margin-bottom:11px;text-transform:uppercase;letter-spacing:.5px}
.br{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--brd);font-size:12px}
.br:last-child{border-bottom:none}
.bl{width:115px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.bt{flex:1;height:4px;border-radius:2px;background:var(--bg4);overflow:hidden}
.bf{height:100%;border-radius:2px}
.bv{font-size:10.5px;color:var(--tx2);font-family:'DM Mono',monospace;width:20px;text-align:right;flex-shrink:0}
.dgc{background:linear-gradient(135deg,var(--am3),var(--bg2) 55%);border:1px solid rgba(191,111,31,.18);border-radius:var(--r2);padding:15px;grid-column:1/-1}
.dg-t{font-size:10px;font-weight:600;color:var(--am);text-transform:uppercase;letter-spacing:.5px;margin-bottom:9px}
.dg-b{font-size:12.5px;line-height:1.7;color:var(--tx);white-space:pre-wrap}

/* MY VIEW */
.mv-hero{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r2);padding:18px 20px;margin-bottom:16px;display:flex;align-items:center;gap:15px}
.hero-av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;flex-shrink:0;border:3px solid}
.hero-g{font-size:17px;font-weight:600;letter-spacing:-.3px}
.hero-s{font-size:11.5px;color:var(--tx3);margin-top:2px}
.hero-st{margin-left:auto;display:flex;gap:14px;text-align:right}
.hsv{font-size:19px;font-weight:600;font-family:'DM Mono',monospace}
.hsl{font-size:9.5px;color:var(--tx3)}
.pri-sec{background:var(--am4);border:1px solid rgba(191,111,31,.13);border-radius:var(--r2);padding:13px 15px;margin-bottom:14px}
.pri-t{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--am);margin-bottom:9px}
.esc-ban{background:var(--or3);border:1px solid rgba(196,92,10,.2);border-radius:var(--r2);padding:11px 14px;margin-bottom:14px;display:flex;align-items:flex-start;gap:10px}
.brief{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r2);padding:14px 16px;margin-bottom:16px}
.brief-t{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--am);margin-bottom:8px}
.brief-b{font-size:12.5px;line-height:1.7;color:var(--tx2)}

/* DETAIL PANEL */

      var rosterUid=(u?.rosterUid||'').trim();
      var firebaseUid=(u?.firebaseUid||'').trim();
      if(firebaseUid)keys.push('firebase:'+firebaseUid);
      if(uid)keys.push('uid:'+uid);
      if(rosterUid)keys.push('roster:'+rosterUid);
      if(email)keys.push('email:'+email);
      return keys;
    }

    function mergeRosterProfile(list,u){
      if(!u||typeof u!=='object')return;
      var copy={...u};
      if(!copy.email&&copy.emaiL)copy.email=copy.emaiL;
      if(copy.email)copy.email=String(copy.email).trim();
      if(copy.uid)copy.uid=String(copy.uid).trim();
      if(copy.firebaseUid)copy.firebaseUid=String(copy.firebaseUid).trim();
      if(copy.rosterUid)copy.rosterUid=String(copy.rosterUid).trim();
      var keys=rosterKeys(copy);
      var idx=list.findIndex(existing=>rosterKeys(existing).some(k=>keys.includes(k)));
      if(idx>=0)list[idx]={...list[idx],...copy};
      else list.push(copy);
    }

    function syncRosterTree(){
      if(!_firebaseRosterUsersLoaded||!_firebaseRosterUsersByEmailLoaded){
        return;
      }
      var firebaseUsers=flattenRosterNode(_firebaseRosterUsers,[]);
      var firebaseUsersByEmail=flattenRosterNode(_firebaseRosterUsersByEmail,[]);
      var firebaseCount=firebaseUsers.length+firebaseUsersByEmail.length;
      var next=[];
      if(firebaseCount>0){
        firebaseUsers.forEach(u=>mergeRosterProfile(next,u));
        firebaseUsersByEmail.forEach(u=>mergeRosterProfile(next,u));
      }else{
        JSON.parse(JSON.stringify(ROSTER_SEED)).forEach(u=>mergeRosterProfile(next,u));
      }
      ROSTER=next;
      if(CU){
        var current=ROSTER.find(x=>rosterKeys(x).some(k=>rosterKeys(CU).includes(k)));
        if(current)CU=current;
      }
      console.log('[ROSTER SYNC]', ROSTER);
      buildQuickUsers();
      if(CU)render();
    }

    db.ref('.info/connected').on('value',s=>{
      fbReady=!!s.val(); setSync(fbReady?'ok':'off');
    });

    // Keep roster in sync with Firebase so profile edits survive refreshes
    db.ref('nd_opsbot/users').on('value',s=>{
      console.log('[FIREBASE USERS]', s.val());
      _firebaseRosterUsers=s.val();
      _firebaseRosterUsersLoaded=true;
      syncRosterTree();
    });

    // Also ingest email-keyed profile records so edited/legacy users are visible
    db.ref('nd_opsbot/usersByEmail').on('value',s=>{
      console.log('[FIREBASE USERS]', s.val());
      _firebaseRosterUsersByEmail=s.val();
      _firebaseRosterUsersByEmailLoaded=true;
      syncRosterTree();
    });

    syncRosterTree();

    // Auth state — register AFTER Firebase is initialized
    firebase.auth().onAuthStateChanged(user=>{
      if(user&&!CU){
        db.ref('nd_opsbot/users/'+user.uid).once('value').then(s=>{
          var p=s.val();
          if(p&&!CU){
            // Ensure rosterUid present (migration for old profiles)
            if(!p.rosterUid){
              var r=findRosterUser(p.email);
              if(r){p.rosterUid=r.uid;p.uid=r.uid;p.firebaseUid=user.uid;
                db.ref('nd_opsbot/users/'+user.uid).set(p);}
            }
            loginAs(p);
          }
        });
      }else if(!user&&!CU){
        try{
          var saved=JSON.parse(localStorage.getItem('opsbot_current_user')||'null');
          if(saved)loginAs(saved);
        }catch(e){}
      }
    });

    // Real-time tasks listener
    // Read-only sync: tasks are loaded from Firebase and deletions must stay deleted.
    db.ref('nd_opsbot/tasks').on('value',s=>{
      var d=s.val();
      
      // Check if empty: null, undefined, or empty object
      var isEmpty = !d || (typeof d==='object' && Object.keys(d).length===0);
      var count = (typeof d==='object'&&d)?Object.keys(d).length:(Array.isArray(d)?d.length:(d?1:0));
      var sig = isEmpty ? 'empty' : Object.keys(d||{}).sort().join('|');
      if(sig===_lastTasksSig){ return; }
      _lastTasksSig = sig;
      
      if(isEmpty){
        tasks={};
        if(CU)render();
        return;
      }
      
      // Tasks exist (not empty)
      var filtered = {};
      var filteredCount = 0;
      Object.keys(d||{}).forEach(id=>{
        if(!_deletedTaskIds[id]){ filtered[id]=d[id]; filteredCount++; }
      });
      if(filteredCount!==count){
        console.log('[opsbot] Filtering deleted tombstones. before=',count,'after=',filteredCount,'deletedIds=',Object.keys(_deletedTaskIds));
        if(filteredCount===0){
          tasks={};
          if(CU)render();
          return;
        }
        db.ref('nd_opsbot/tasks').set(filtered).catch(err=>console.warn('[opsbot] tombstone filter write failed',err));
        tasks=filtered;
        if(CU)render();
        return;
      }
      console.log('[opsbot] Tasks loaded (count=',count,')');
      tasks=d;
      if(CU)render();
    });

    // Debug: watch metadata flags so we can see when seeded or intentionally cleared markers change
    try{
      db.ref('nd_opsbot/_meta').on('value',s=>{
        var m = s.val();
        if(m && m.deletedTaskIds){
          _deletedTaskIds = m.deletedTaskIds || {};
          try{ localStorage.setItem('opsbot_deleted_task_ids', JSON.stringify(_deletedTaskIds)); }catch(e){}
        }
        console.log('[opsbot] _meta changed:', m);
      });
    }catch(e){console.warn('[opsbot] _meta watch failed',e);}

    db.ref('nd_opsbot/activity').orderByChild('ts').limitToLast(60).on('value',s=>{
      var d=s.val();
      actLog=d?Object.values(d).sort((a,b)=>b.ts-a.ts):[];
      if(CU&&VIEW==='myview')render();
    });

    // Sync client/project config
    db.ref('nd_opsbot/clients').on('value',s=>{
      var d=s.val(); if(d){ CLIENTS=Object.values(d); rebuildProjColors(); }
    });

  }catch(e){
    setSync('off');
    // Offline fallback stays empty so deletions don't get repopulated locally
    tasks={};
    console.warn('Firebase offline, local mode:',e.message);
  }
}

function canSeeTask(t){
  if(!CU)return false;
  if(perm('canSeeAll'))return true;
  // Use rosterUid for task matching (tasks store roster short UIDs like 'tanvi')
  var myUid = CU.rosterUid || CU.uid;
  // Always show tasks created by the current user
  if(t.creatorUid===myUid||t.creator===CU.name)return true;
  // member: own dept OR assigned to them
  if(CU.role==='member'){
    var deptOk=t.dept===CU.dept;
    var assignOk=t.assigneeUid===myUid||t.assignee===CU.name;
    // client restriction
    if(CU.clients&&!CU.clients.includes(t.client))return false;
    return deptOk||assignOk;
  }
  // intern: only assigned to them + client restriction
  if(CU.role==='intern'){
    if(CU.clients&&!CU.clients.includes(t.client))return false;
    return t.assigneeUid===myUid||t.assignee===CU.name;
  }
  return false;
}
function visibleTasks(){ return Object.values(tasks).filter(canSeeTask); }
function filteredTasks(){
  var all=visibleTasks();
  if(CF!=='All')all=all.filter(t=>t.client===CF);
  if(PF!=='All')all=all.filter(t=>t.project===PF);
  return all;
}
function visibleClients(){
  if(perm('canSeeAll'))return CLIENTS;
  return CLIENTS.filter(c=> CU?.clients?CU.clients.includes(c.id):true);
}
function profileEmailKey(email){
  return encodeURIComponent(String(email||'').trim().toLowerCase());
}
function findRosterUser(ref){
  var key=String(ref||'').trim().toLowerCase();
  if(!key)return null;
  return ROSTER.find(u=>
    String(u.uid||'').trim()===ref||
    String(u.firebaseUid||'').trim()===ref||
    String(u.rosterUid||'').trim()===ref||
    String(u.email||'').trim().toLowerCase()===key||
    String(u.name||'').trim().toLowerCase()===key||
    String(u.fullName||'').trim().toLowerCase()===key
  )||null;
}
function ensureVisibleTask(t){
  if(!CU||perm('canSeeAll'))return t;
  var myUid = CU.rosterUid || CU.uid || '';
  var vc = visibleClients();
  var firstClient = vc[0];
  if(firstClient && (!t.client || !vc.some(c=>c.id===t.client))){
    t.client = firstClient.id;
    if(firstClient.projects&&firstClient.projects.length){
      t.project = firstClient.projects[0];
    }
  }
  if(!canSeeTask(t)){
    t.assignee = CU.name;
    t.assigneeUid = myUid;
    t.dept = CU.dept || t.dept;
    if(!canSeeTask(t) && firstClient){
      t.client = firstClient.id;
      if(firstClient.projects&&firstClient.projects.length){
        t.project = firstClient.projects[0];
      }
    }
  }
  return t;
}
function saveTask(t){
  tasks[t.id]=t;
  if(db)db.ref('nd_opsbot/tasks/'+t.id).set(t);
  render();
}
function removeTask(id){
  if(db){
    console.log('[opsbot] removeTask() -> removing',id);
    db.ref('nd_opsbot/tasks/'+id).remove().then(()=>{
      console.log('[opsbot] removeTask() -> removed',id);
      _deletedTaskIds[id]=true;
      try{ localStorage.setItem('opsbot_deleted_task_ids', JSON.stringify(_deletedTaskIds)); }catch(e){}
      db.ref('nd_opsbot/_meta/deletedTaskIds/'+id).set(true).catch(()=>{});
      // After removal, check whether any tasks remain; if none, set an intentional-clear marker
      db.ref('nd_opsbot/tasks').once('value').then(s=>{
        var d=s.val();
        var isEmpty = !d || (typeof d==='object' && Object.keys(d).length===0);
        if(isEmpty){
          console.log('[opsbot] All tasks deleted — setting intentionallyClearedAt');
          db.ref('nd_opsbot/_meta/intentionallyClearedAt').set(Date.now()).catch(()=>{});
        }
      }).catch(err=>{console.warn('[opsbot] removeTask() check failed',err);});
    }).catch(err=>{console.error('[opsbot] removeTask() failed',err);} );
  }else{delete tasks[id];render();}
}
function logAct(action,detail){
  var e={time:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),action,detail,user:CU?.name||'System',ts:Date.now()};
  if(db)db.ref('nd_opsbot/activity').push(e);
  else actLog.unshift(e);
}

function loadChat(){
  if(!db||!CU){
    chatLocal=[CHAT_WELCOME];
    return;
  }
  // Use rosterUid for chat path so it's consistent across logins
  var chatUid = CU.rosterUid || CU.uid;
  db.ref('nd_opsbot/chats/'+chatUid).orderByChild('ts').limitToLast(120).once('value',s=>{
    var d=s.val();
    if(d){
      chatLocal=Object.values(d).sort((a,b)=>a.ts-b.ts);
    }else{
      chatLocal=[CHAT_WELCOME];
      saveMsg(CHAT_WELCOME);
    }
    if(VIEW==='chat')render();
  });
}
function saveMsg(msg){
  if(!db||!CU)return;
  var chatUid = CU.rosterUid || CU.uid;
  var entry={...msg,ts:msg.ts||Date.now()};
  // Strip undefined actions to keep Firebase clean
  if(!entry.actions)delete entry.actions;
  db.ref('nd_opsbot/chats/'+chatUid).push(entry);
}
function isOD(t){
  if(!t.due||t.done)return false;
  var M={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  var p=t.due.split(' ');
  if(p.length<2||M[p[0]]===undefined)return false;
  var dt=new Date(2026,M[p[0]],parseInt(p[1]));
  var tod=new Date();tod.setHours(0,0,0,0);
  return dt<tod;
}
function isEsc(t){return !t.done&&(t.escalated||(isOD(t)&&t.prio==='urgent'));}

function buildQuickUsers(){

  var list=[...ROSTER].sort((a,b)=>{
    var rank={owner:0,admin:1,member:2,intern:3};

    </button>`).join('');
}

function quickLogin(uid){

  doFirebaseLogin(u.email,pw);
}

function doLogin(){
  var em=document.getElementById('lu').value.trim();
  var pw=document.getElementById('lp').value.trim();
  var err=document.getElementById('lerr');
  err.style.display='none';
  if(!em||!pw){showErr('Please enter your email and password.');return;}

}

function doFirebaseLogin(email,pass){
  var btn=document.getElementById('lbtn');
  if(btn){btn.disabled=true;btn.textContent='Signing in…';}
  setErr('');

  if(!fbReady||!firebase.auth){
    // Fallback: local roster auth
    var u=findRosterUser(email);
    if(u&&u.pass!==pass)u=null;
    if(u){loginAs(u);}else{showErr('Incorrect credentials.');}
    if(btn){btn.disabled=false;btn.textContent='Sign in →';}
    return;
  }

  firebase.auth().signInWithEmailAndPassword(email,pass)
    .then(cred=>{
      var firebaseUid=cred.user.uid;
      // Look up profile from Firebase first, fall back to roster
      db.ref('nd_opsbot/users/'+firebaseUid).once('value').then(s=>{
        var profile=s.val();
        if(!profile){
          db.ref('nd_opsbot/usersByEmail/'+profileEmailKey(email)).once('value').then(se=>{
            profile=se.val();
            if(profile){
              profile.firebaseUid=firebaseUid;
              profile.uid=profile.uid||firebaseUid;
              profile.rosterUid=profile.rosterUid||profile.uid;
              db.ref('nd_opsbot/users/'+firebaseUid).set(profile);
            }
            if(!profile){
          // First login — find in roster by email, write profile
              var r=findRosterUser(email);
          if(r){
            // rosterUid = original short uid ('tanvi','ayush' etc) for task matching
            // firebaseUid = real Firebase Auth uid for DB path
            profile={...r, firebaseUid, rosterUid: r.uid, uid: r.uid};
            db.ref('nd_opsbot/users/'+firebaseUid).set(profile);
            db.ref('nd_opsbot/usersByEmail/'+profileEmailKey(email)).set(profile);
          }
            }
            if(profile)loginAs(profile);
            else showErr('No profile found. Contact your admin.');
            if(btn){btn.disabled=false;btn.textContent='Sign in →';}
          });
        } else {
          // Already exists — ensure rosterUid is set (migration for old profiles)
          if(!profile.rosterUid){
            var r=findRosterUser(email);
            if(r){
              profile.rosterUid=r.uid;
              profile.uid=r.uid;
              profile.firebaseUid=firebaseUid;
              db.ref('nd_opsbot/users/'+firebaseUid).set(profile);
              db.ref('nd_opsbot/usersByEmail/'+profileEmailKey(email)).set(profile);
            }
          }
          db.ref('nd_opsbot/usersByEmail/'+profileEmailKey(email)).set(profile);
          if(profile)loginAs(profile);
          else showErr('No profile found. Contact your admin.');
          if(btn){btn.disabled=false;btn.textContent='Sign in →';}
        }
      });
    })
    .catch(e=>{
      var u=findRosterUser(email);
      if(u&&u.pass!==pass)u=null;
      if(u){
        // Fallback for edited profiles or local roster auth
        loginAs(u);
      }else{
        var msg=e.code==='auth/user-not-found'||e.code==='auth/wrong-password'?'Incorrect credentials.':'Login error: '+e.message;
        showErr(msg);
      }
      if(btn){btn.disabled=false;btn.textContent='Sign in →';}
    });
}

function rmProject(cid,pname){
  if(!perm('canManageTeam'))return;
  var cl=CLIENTS.find(c=>c.id===cid);
  if(!cl)return;
  if(!cl.projects.includes(pname))return;
  var taskCount=Object.values(tasks).filter(t=>t.client===cid&&t.project===pname).length;
  var msg=`Delete project "${pname}" from ${cl.name}?`;
  if(taskCount)msg+=`\n\n${taskCount} task(s) will be moved to another project.`;
  if(!confirm(msg))return;

  var fallback=cl.projects.find(p=>p!==pname)||'General';
  cl.projects=cl.projects.filter(p=>p!==pname);
  if(!cl.projects.length){
    cl.projects=[fallback];
  }
  if(!PCOLORS[fallback])PCOLORS[fallback]=cl.color;
  if(!ALL_PROJS.includes(fallback))ALL_PROJS.push(fallback);

  Object.values(tasks).forEach(t=>{
    if(t.client===cid&&t.project===pname){
      t.project=fallback;
      saveTask(t);
    }
  });

  delete PCOLORS[pname];
  ALL_PROJS=ALL_PROJS.filter(p=>p!==pname);
  if(db)db.ref('nd_opsbot/clients/'+cid).set(cl);
  if(CF===pname||PF===pname){CF='All';PF='All';}
  logAct('Project deleted',`${pname} from ${cl.name}`);
  buildClientSidebar();
  render();
}

// ════════════════════════════════════════════════
// MY VIEW
// ════════════════════════════════════════════════
function rMyView(){
  var u=CU;if(!u)return'';
  var all=visibleTasks();
  var mine=all.filter(t=>t.assigneeUid===u.uid&&!t.done);
  var mDone=all.filter(t=>t.assigneeUid===u.uid&&t.done).length;
  var mOD=mine.filter(t=>isOD(t));
  var esc=all.filter(t=>isEsc(t));
  var urg=mine.filter(t=>t.prio==='urgent');
  var tod=mine.filter(t=>t.prio==='today');
  var hr=new Date().getHours();
  var gr=hr<12?'Good morning':hr<17?'Good afternoon':hr<21?'Good evening':'Hey';
  var html=`<div class="mv-hero">
    <div class="hero-av" style="background:${u.bg};color:${u.color};border-color:${u.color}44">${u.ini}</div>
    <div>
      <div class="hero-g">${gr}, ${u.fullName.split(' ')[0]}</div>
      <div class="hero-s">${u.role} · ${u.dept}</div>
    </div>
    <div class="hero-st">
      <div><div class="hsv" style="color:var(--am)">${mine.length}</div><div class="hsl">Open</div></div>
      <div><div class="hsv" style="color:var(--rd2)">${mOD.length}</div><div class="hsl">Overdue</div></div>
      <div><div class="hsv" style="color:var(--gn2)">${mDone}</div><div class="hsl">Done</div></div>
    </div>
  </div>`;
  if(perm('canSeeAll')&&esc.length){
    html+=`<div class="esc-ban"><div style="font-size:16px;flex-shrink:0">🚨</div><div>
      <div style="font-size:12.5px;font-weight:600;color:var(--ord)">${esc.length} escalated item${esc.length>1?'s':''} need attention</div>
      <div style="font-size:11px;color:var(--or);margin-top:2px">${esc.map(t=>'"'+t.title+'"').slice(0,3).join(' · ')}</div>
    </div></div>`;
  }
  if(perm('canSeeAll')){
    html+=`<div class="brief" id="brief-card"><div class="brief-t">✦ Morning Brief</div><div class="brief-b" id="brief-body" style="color:var(--tx3)">Generating…</div></div>`;
  }
  var prio=[...new Set([...urg,...tod.filter(t=>!urg.includes(t))])].slice(0,5);
  if(prio.length){
    html+=`<div class="pri-sec"><div class="pri-t">🔥 Priority Today</div><div class="tl">${rRows(prio)}</div></div>`;
  }
  html+=`<div class="sh">All My Tasks (${mine.length})</div><div class="tl">${rRows(mine)}</div>`;
  if(perm('canSeeAll')){
    var tOD=all.filter(t=>!t.done&&isOD(t)&&t.assigneeUid!==u.uid);
    if(tOD.length)html+=`<div style="margin-top:16px"><div class="sh">Team Overdue (${tOD.length})</div><div class="tl">${rRows(tOD.slice(0,6))}</div></div>`;
    html+=`<div style="margin-top:16px"><div class="sh">Recent Activity</div>${rAct()}</div>`;
  }
  html+='<div style="height:16px"></div>';
  return html;
}
function genMorningBrief(){
  var el=document.getElementById('brief-body');if(!el)return;
  var all=visibleTasks();
  var ov=all.filter(t=>isOD(t)),esc=all.filter(t=>isEsc(t));
  var urg=all.filter(t=>t.prio==='urgent'&&!t.done);
  var top=ROSTER.map(u=>({n:u.name,c:all.filter(t=>t.assigneeUid===u.uid&&!t.done).length})).sort((a,b)=>b.c-a.c)[0];
  var lines=[`${all.filter(t=>!t.done).length} tasks open across ${[...new Set(all.map(x=>x.project))].length} projects.`];
  if(esc.length)lines.push(`🚨 ${esc.length} escalated: ${esc.map(t=>t.title).slice(0,2).join(', ')}.`);
  if(ov.length)lines.push(`⚠ ${ov.length} overdue — immediate action needed.`);
  if(urg.length)lines.push(`🔥 ${urg.length} urgent tasks in progress.`);
  if(top&&top.c>3)lines.push(`👤 ${top.n} has highest load (${top.c} open).`);
  lines.push(`Recommended: Escalations → Overdue → Urgent.`);
  el.textContent=lines.join('\n');el.style.color='';
}
function rAct(){
  if(!actLog.length)return'<div style="color:var(--tx3);font-size:12px;padding:6px 0">No activity yet.</div>';
  return`<div style="background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r2);padding:11px 13px">
    ${actLog.slice(0,8).map(a=>`<div class="ai">
      <div style="width:5px;height:5px;border-radius:50%;background:var(--am);margin-top:4px;flex-shrink:0"></div>
      <div style="flex:1"><span style="color:var(--tx2)">${a.action}</span> — <span style="color:var(--tx3)">${a.detail}</span></div>
      <div class="at">${a.time}</div>
    </div>`).join('')}
  </div>`;
}

// DASHBOARD
// ════════════════════════════════════════════════
function rHome(){
  var all=filteredTasks();
  var done=all.filter(x=>x.done).length,urg=all.filter(x=>x.prio==='urgent'&&!x.done).length;
  var act=all.filter(x=>!x.done).length,ov=all.filter(x=>isOD(x)).length;
  var esc=all.filter(x=>isEsc(x)).length,pct=all.length?Math.round(done/all.length*100):0;
  var html=`<div class="sg">
    ${sc('Total',all.length,[...new Set(all.map(x=>x.project))].length+' projects','var(--tx)')}
    ${sc('Active',act,'in flight','var(--bl2)')}
    ${sc('Urgent',urg,urg?'needs focus':'all clear',urg?'var(--rd2)':'var(--gn2)')}
    ${sc('Overdue',ov,ov?'past due':'on track',ov?'var(--rd2)':'var(--gn2)')}
    ${sc('Done',pct+'%','completion','var(--gn2)')}
  </div>`;
  if(esc)html+=`<div class="esc-ban" style="margin-bottom:14px"><div style="font-size:15px">🚨</div><div><strong style="color:var(--ord)">${esc} escalated task${esc>1?'s':''}</strong><span style="color:var(--or);font-size:11px;margin-left:6px">require attention</span></div></div>`;
  html+=`<div class="sh">Tasks
    <div style="display:flex;gap:5px;align-items:center;margin-left:8px">
      ${['All','Urgent','Today','Overdue','Escalated','Mine'].map((f,i)=>`<button class="fb${i===0?' active':''}" data-f="${f.toLowerCase()}" onclick="filtH('${f.toLowerCase()}')">${f}</button>`).join('')}
      <input class="srch" placeholder="Search…" oninput="srchH(this.value)" id="h-srch">
    </div>
  </div>`;
  html+=`<div class="tl" id="h-tl">${rRows(filteredTasks())}</div>`;
  return html;
}
function sc(l,v,s,c){return`<div class="sc"><div class="sc-l">${l}</div><div class="sc-v" style="color:${c}">${v}</div><div class="sc-s">${s}</div></div>`;}
function filtH(f){
  document.querySelectorAll('.fb').forEach(x=>x.classList.toggle('active',x.dataset.f===f));
  var all=filteredTasks();
  var list=f==='urgent'?all.filter(x=>x.prio==='urgent'&&!x.done):
            f==='today'?all.filter(x=>x.prio==='today'&&!x.done):
            f==='overdue'?all.filter(x=>isOD(x)):
            f==='escalated'?all.filter(x=>isEsc(x)):
            f==='mine'?all.filter(x=>x.assigneeUid===CU?.uid):all;
  var el=document.getElementById('h-tl');if(el)el.innerHTML=rRows(list);
  var s=document.getElementById('h-srch');if(s)s.value='';
}
function srchH(q){
  q=q.toLowerCase().trim();
  document.querySelectorAll('.fb').forEach(x=>x.classList.remove('active'));
  var list=q?filteredTasks().filter(t=>t.title.toLowerCase().includes(q)||t.assignee.toLowerCase().includes(q)||t.project.toLowerCase().includes(q)||(t.desc||'').toLowerCase().includes(q)):filteredTasks();
  var el=document.getElementById('h-tl');if(el)el.innerHTML=rRows(list);
}

// ════════════════════════════════════════════════
// TASK ROWS
// ════════════════════════════════════════════════
function rRows(list){
  if(!list.length)return'<div class="es">No tasks here.</div>';
  return list.map(t=>{
    var ov=isOD(t),esc=isEsc(t);
    var u=findRosterUser(t.assigneeUid)||findRosterUser(t.assignee)||findRosterUser(t.creatorUid)||findRosterUser(t.creator);
    var canChk=perm('canSeeAll')||t.assigneeUid===CU?.uid||t.assignee===CU?.name;
    return`<div class="tr${esc?' is-esc':ov?' is-ov':''}" onclick="openDetail('${t.id}')">
      <div class="chk${t.done?' done':''}" onclick="event.stopPropagation();${canChk?`toggleDone('${t.id}')`:''}"></div>
      <div class="tm">
        <div class="tt${t.done?' done':''}">${t.title}</div>
        ${t.desc?`<div class="tdesc">${t.desc}</div>`:''}
      </div>
      <div class="tmeta">
        ${t.prio==='urgent'?'<span class="tag t-urg">urgent</span>':''}
        ${t.prio==='today'?'<span class="tag t-tod">today</span>':''}
        ${esc?'<span class="tag t-esc">🚨 esc</span>':ov&&!t.done?'<span class="tag t-ov">overdue</span>':''}
        <div class="mav" style="background:${u?u.bg:'var(--bg3)'};color:${u?u.color:'var(--tx2)'};border-color:${u?u.color+'44':'var(--brd)'}" title="${t.assignee}">${u?u.ini:t.assignee?.slice(0,2)||'?'}</div>
        <span class="tag t-nor">${t.project}</span>
        ${t.due?`<span class="tag t-nor" style="color:${ov?'var(--rd2)':'var(--tx3)'}">${t.due}</span>`:''}
      </div>
    </div>`;
  }).join('');
}
function toggleDone(id){
  var t=tasks[id];if(!t)return;
  if(!perm('canSeeAll')&&t.assigneeUid!==CU?.uid&&t.assignee!==CU?.name)return;
  t.done=!t.done;t.col=t.done?'Done':'Todo';
  saveTask(t);logAct(t.done?'Task done':'Task reopened',`"${t.title}"`);
}

        ${cards.map(t=>{
          var ov=isOD(t),esc=isEsc(t);

              ${t.due?`<span style="font-size:10px;color:${ov?'var(--rd2)':'var(--tx3)'}">${t.due}</span>`:''}
              <span class="tag t-${t.prio}" style="font-size:10px">${t.prio}</span>
              ${esc?'<span style="font-size:11px">🚨</span>':''}
            </div>
          </div>`;
        }).join('')}
      </div>
      ${perm('canCreateAny')?`<div class="add-c" onclick="openModal('task')">+ Add card</div>`:''}
    </div>`;
  }).join('')}</div>`;
}
function dStart(e,id){dragId=id;setTimeout(()=>{var c=document.getElementById('kc-'+id);if(c)c.classList.add('dragging');},0);}
function dEnd(){document.querySelectorAll('.kc').forEach(c=>c.classList.remove('dragging'));document.querySelectorAll('.bc-dz').forEach(c=>c.classList.remove('drag-over'));}
function dOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function dDrop(e,col){
  e.preventDefault();
  document.querySelectorAll('.bc-dz').forEach(c=>c.classList.remove('drag-over'));
  if(dragId){
    var t=tasks[dragId];
    if(t&&(perm('canSeeAll')||t.assigneeUid===CU?.uid)){
      t.col=col;t.done=col==='Done';saveTask(t);logAct('Card moved',`"${t.title}" → ${col}`);
    }
  }
  dragId=null;
}

       <div class="fg"><label class="fl">Department</label><select class="fi" id="em_dept">${DEPTS.map(d=>`<option${m.dept===d?' selected':''}>${d}</option>`).join('')}</select></div>

}

function saveMemberProfile(uid){
  if(!perm('canManageTeam'))return;
  var m=findRosterUser(uid);if(!m)return;
  var oldName=m.name, oldEmail=m.email;
  var newName=document.getElementById('em_name')?.value.trim()||m.name;
  var newEmail=document.getElementById('em_email')?.value.trim()||m.email;
  var newRole=document.getElementById('em_role')?.value||m.role;
  var newDept=document.getElementById('em_dept')?.value||m.dept;
  var newClients=document.getElementById('em_clients')?.value.trim();
  var newPass=document.getElementById('em_pass')?.value.trim();
  var clientList=newClients?newClients.split(',').map(x=>x.trim()).filter(Boolean):null;

  m.name=newName;
  m.fullName=newName;
  m.email=newEmail;
  m.role=newRole;
  m.dept=newDept;
  m.clients=clientList;
  m.isAdmin=newRole==='admin'||newRole==='owner';
  m.ini=newName.split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2);
  m.color=m.color||'#888';
  m.bg=m.bg||'#f0f0f0';
  if(newPass)m.pass=newPass;

  console.log('[opsbot] saveMemberProfile()', {uid, oldEmail, newEmail, newName, newRole, newDept});

  Object.values(tasks).forEach(t=>{
    if(t.assigneeUid===uid){t.assignee=newName;saveTask(t);}
    if(t.creatorUid===uid){t.creator=newName;saveTask(t);}
  });

  var me=firebase.auth&&firebase.auth().currentUser;
  if(me&&me.uid===m.firebaseUid){
    if(newEmail&&newEmail!==oldEmail){me.updateEmail(newEmail).catch(err=>console.warn('[opsbot] updateEmail failed',err));}
    if(newPass){me.updatePassword(newPass).catch(err=>console.warn('[opsbot] updatePassword failed',err));}
  }

  // Update UI immediately so the save button feels responsive.
  if(CU&&CU.uid===uid){CU=m;}
  buildQuickUsers();
  buildClientSidebar();
  render();
  logAct('Profile edited',`${oldName} → ${newName}`);
  closeModal();
  alert('Profile saved.');

  // Persist in the background. Use separate writes so one failing path does not block the rest.
  if(db){
    var basePath='nd_opsbot/users/'+(m.firebaseUid||m.uid);
    db.ref(basePath).set(m).catch(err=>console.warn('[opsbot] profile base write failed',err));
    db.ref('nd_opsbot/usersByEmail/'+profileEmailKey(m.email)).set(m).catch(err=>console.warn('[opsbot] profile email write failed',err));
    if(m.uid&&m.uid!==(m.firebaseUid||'')){
      db.ref('nd_opsbot/users/'+m.uid).set(m).catch(err=>console.warn('[opsbot] profile roster write failed',err));
    }
    if(oldEmail&&oldEmail!==newEmail){
      db.ref('nd_opsbot/usersByEmail/'+profileEmailKey(oldEmail)).remove().catch(err=>console.warn('[opsbot] old email cleanup failed',err));
    }
  }
}

function rmMember(uid){
  var u=findRosterUser(uid);if(!u)return;
  if(!confirm(`Remove ${u.name}?`))return;
  Object.values(tasks).filter(t=>t.assigneeUid===uid).forEach(t=>{t.assignee='Unassigned';t.assigneeUid='';saveTask(t);});
  if(db){
    var writes=[db.ref('nd_opsbot/users/'+(u.firebaseUid||u.uid)).remove()];
    if(u.email)writes.push(db.ref('nd_opsbot/usersByEmail/'+profileEmailKey(u.email)).remove());
    Promise.all(writes).then(()=>{ logAct('Member removed',u.name); syncRosterTree(); }).catch(err=>alert('Could not remove member: '+err.message));
  }else{
    ROSTER.splice(ROSTER.indexOf(u),1);logAct('Member removed',u.name);render();
  }
}

function rReport(){
  var all=visibleTasks();
  var mxN=Math.max(...CLIENTS.flatMap(c=>c.projects).map(p=>all.filter(x=>x.project===p).length),1);
  var tCnt=CLIENTS.flatMap(c=>c.projects).map(p=>({p,n:all.filter(x=>x.project===p).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,8);
  var health=CLIENTS.flatMap(c=>c.projects).map(p=>{
    var pt=all.filter(x=>x.project===p);if(!pt.length)return null;
    var ov=pt.filter(x=>isOD(x)).length,dr=Math.round(pt.filter(x=>x.done).length/pt.length*100);
    return{p,score:dr-(ov*25),ov,dr};
  }).filter(Boolean).sort((a,b)=>a.score-b.score);
  var dLoad=DEPTS.map(d=>{var ms=ROSTER.filter(u=>u.dept===d);return{d,open:all.filter(t=>!t.done&&ms.some(m=>m.uid===t.assigneeUid||m.rosterUid===t.assigneeUid||m.firebaseUid===t.assigneeUid)).length,count:ms.length};});
  return`<div class="rg">
    <div class="rc"><div class="rc-t">Tasks per project</div>
      ${tCnt.map(x=>`<div class="br"><span class="bl">${x.p}</span><div class="bt"><div class="bf" style="width:${Math.round(x.n/mxN*100)}%;background:var(--bl2)"></div></div><span class="bv">${x.n}</span></div>`).join('')}
    </div>
    <div class="rc"><div class="rc-t">Department workload</div>
      ${dLoad.map(x=>{var pct=Math.min(Math.round(x.open/Math.max(x.count*5,1)*100),100);var lc=pct>70?'var(--rd2)':pct>40?'var(--am2)':'var(--gn2)';return`<div class="br"><span class="bl">${x.d.split(' ')[0]}</span><div class="bt"><div class="bf" style="width:${pct}%;background:${lc}"></div></div><span class="bv" style="width:50px;font-size:10px">${x.open} open</span></div>`;}).join('')}
    </div>
    <div class="rc" style="grid-column:1/-1"><div class="rc-t">Project health</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        ${health.map(x=>{var clr=x.score<0?'var(--rd2)':x.score<40?'var(--am2)':'var(--gn2)';var lbl=x.score<0?'At risk':x.score<40?'Watch':'On track';var bg=x.score<0?'var(--rd3)':x.score<40?'var(--am3)':'var(--gn3)';var tc=x.score<0?'var(--rdd)':x.score<40?'var(--amd)':'var(--gnd)';return`<div style="display:flex;align-items:center;gap:7px;padding:6px 8px;border:1px solid var(--brd);border-radius:7px;background:var(--bg2)"><div style="width:7px;height:7px;border-radius:50%;flex-shrink:0;background:${clr}"></div><span style="flex:1;font-size:12px;font-weight:500">${x.p}</span><span class="tag" style="background:${bg};color:${tc}">${lbl}</span><span style="margin-left:5px;font-size:10.5px;color:var(--tx3);font-family:DM Mono,monospace">${x.dr}%</span>${x.ov?`<span class="tag t-ov" style="font-size:10px;margin-left:3px">${x.ov}⚠</span>`:''}</div>`;}).join('')}
      </div>
    </div>
    <div class="dgc"><div class="dg-t">✦ AI Weekly Digest</div>
      <div class="dg-b" id="dig-b">Generating…</div>
      <button class="btn btn-g" style="margin-top:10px;font-size:11px" onclick="genDigest()">↻ Refresh</button>
    </div>
  </div>`;
}
function genDigest(){
  var el=document.getElementById('dig-b');if(!el)return;
  var all=visibleTasks();
  var ov=all.filter(t=>isOD(t)),esc=all.filter(t=>isEsc(t)),urg=all.filter(t=>t.prio==='urgent'&&!t.done);
  var top=ROSTER.map(u=>({n:u.name,c:all.filter(t=>t.assigneeUid===u.uid||t.assigneeUid===u.rosterUid||t.assigneeUid===u.firebaseUid&&!t.done).length})).sort((a,b)=>b.c-a.c)[0];
  var lines=[`Week ending ${new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}.`,``,`${all.filter(t=>t.done).length} done · ${all.filter(t=>!t.done).length} active · ${[...new Set(all.map(x=>x.project))].length} projects · ${[...new Set(all.map(x=>x.client))].length} clients.`];
  if(esc.length)lines.push(`\n🚨 Escalations (${esc.length}): ${esc.map(t=>'"'+t.title+'"').slice(0,3).join(', ')}.`);
  if(ov.length)lines.push(`⚠ Overdue (${ov.length}): ${ov.map(t=>'"'+t.title+'"').slice(0,3).join(', ')}.`);
  if(urg.length)lines.push(`🔥 Urgent: ${urg.map(t=>t.title+' ('+t.assignee.split(' ')[0]+')').slice(0,4).join(', ')}.`);
  if(top&&top.c>0)lines.push(`👤 Highest load: ${top.n} — ${top.c} open tasks.`);
  lines.push(`\nFocus: Escalations → Overdue → Urgent → Review queue.`);
  el.textContent=lines.join('\n');
}

    (canEdit?`<button class="btn btn-g" style="font-size:11px" onclick="openEditModal('${id}')">Edit</button>`:'')
    +`<button class="btn ${t.done?'btn-g':'btn-p'}" style="font-size:11px" onclick="toggleDone('${id}');openDetail('${id}')">${t.done?'Reopen':'Mark Done'}</button>`;

    </div>
    <div class="g2">
      <div class="dpf"><div class="dpl">Assignee</div>
        <div style="display:flex;align-items:center;gap:7px">
          <div class="uav" style="width:22px;height:22px;font-size:8px;background:${u?u.bg:'var(--bg3)'};color:${u?u.color:'var(--tx2)'};border:1.5px solid ${u?u.color+'44':'var(--brd)'}">${u?u.ini:t.assignee?.slice(0,2)||'?'}</div>
          <span>${t.assignee}</span>
        </div>

      <div class="dpf"><div class="dpl">Due</div><div class="dpv" style="color:${ov?'var(--rd2)':'var(--tx)'}">${t.due||'—'}</div></div>
    </div>
    <div class="g2">
      <div class="dpf"><div class="dpl">Project</div><div class="dpv">${t.project}</div></div>
      <div class="dpf"><div class="dpl">Department</div><div class="dpv">${t.dept||'—'}</div></div>
    </div>

    <div class="dpf"><div class="dpl">Task ID</div><div class="dpv" style="font-family:DM Mono,monospace;font-size:11.5px">#${id}</div></div>
    ${perm('canSeeAll')&&!esc?`<button class="btn btn-g" style="width:100%;justify-content:center;margin-bottom:5px;color:var(--ord)" onclick="escTask('${id}')">🚨 Escalate to Ayush</button>`:''}
    ${perm('canDelete')?`<button class="btn btn-d" style="width:100%;justify-content:center" onclick="delTask('${id}')">Delete Task</button>`:''}`;
  document.getElementById('dp').classList.add('open');
}
function closeDetail(){document.getElementById('dp').classList.remove('open');}
function escTask(id){var t=tasks[id];if(!t)return;t.escalated=true;saveTask(t);logAct('Escalated',`"${t.title}" → Ayush`);openDetail(id);render();}
function delTask(id){
  if(!perm('canDelete'))return;
  if(!confirm('Delete this task?'))return;
  logAct('Task deleted',`"${tasks[id]?.title||id}"`);removeTask(id);closeDetail();
}

       </div>

         <div class="fg"><label class="fl">Login Email</label><input class="fi" id="me" placeholder="priya@nextdot.co.in" type="email"></div>

function openEditModal(id){
  var t=tasks[id];if(!t)return;
  var dueFmt='';
  if(t.due){var mo={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};var p=t.due.split(' ');if(p.length>=2&&mo[p[0]])dueFmt=`2026-${mo[p[0]]}-${p[1].padStart(2,'0')}`;}
  var h=mWrap('Edit Task',
    `<div class="fg"><label class="fl">Title</label><input class="fi" id="et" value="${(t.title||'').replace(/"/g,'&quot;')}"></div>
     <div class="fg"><label class="fl">Description</label><textarea class="fi fi-ta" id="ed">${t.desc||''}</textarea></div>
     <div class="g2">
       <div class="fg"><label class="fl">Priority</label><select class="fi" id="ep"><option value="urgent"${t.prio==='urgent'?' selected':''}>🔴 Urgent</option><option value="today"${t.prio==='today'?' selected':''}>🟡 Today</option><option value="normal"${t.prio==='normal'?' selected':''}>⚪ Normal</option></select></div>
       <div class="fg"><label class="fl">Due Date</label><input class="fi" id="edu" type="date" value="${dueFmt}"></div>
     </div>
     <div class="g2">
       <div class="fg"><label class="fl">Assignee</label><select class="fi" id="ea">${ROSTER.map(m=>`<option value="${m.name}"${m.name===t.assignee?' selected':''}>${m.name}</option>`).join('')}</select></div>
       <div class="fg"><label class="fl">Status</label><select class="fi" id="ecol"><option${t.col==='Todo'?' selected':''}>Todo</option><option${t.col==='In Progress'?' selected':''}>In Progress</option><option${t.col==='Review'?' selected':''}>Review</option><option${t.col==='Done'?' selected':''}>Done</option></select></div>
     </div>`,
    `<button class="btn btn-g" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="doEditTask('${id}')">Save</button>`);
  document.getElementById('modal-area').innerHTML=h;
}
function syncProj(){var cid=document.getElementById('ncl')?.value;var cl=CLIENTS.find(c=>c.id===cid);var s=document.getElementById('nproj');if(s&&cl)s.innerHTML=cl.projects.map(p=>`<option>${p}</option>`).join('');}
function parseDue(v){if(!v)return'';var p=v.split('-');if(p.length===3){var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];var m=parseInt(p[1],10)-1,d=parseInt(p[2],10);if(M[m])return M[m]+' '+d;}return v;}
function doAddTask(){
  var title=document.getElementById('nt')?.value.trim();if(!title)return;
  var assigneeName=document.getElementById('na')?.value||CU?.name||'Unassigned';
  var assigneeObj=findRosterUser(assigneeName);
  var id='t'+Date.now();
  var t={id,title,desc:document.getElementById('nd')?.value.trim()||'',prio:document.getElementById('np')?.value||'normal',done:false,
    assignee:assigneeName,assigneeUid:assigneeObj?.uid||'',
    dept:document.getElementById('ndept')?.value||'Operations',
    project:document.getElementById('nproj')?.value||ALL_PROJS[0],
    client:document.getElementById('ncl')?.value||'internal',col:'Todo',
    due:parseDue(document.getElementById('ndu')?.value||''),escalated:false,created:Date.now(),
    creator:CU?.name||'System',creatorUid:CU?.rosterUid||CU?.uid||''};
  saveTask(t);logAct('Task created',`"${t.title}" → ${t.assignee}`);closeModal();
}
function doEditTask(id){
  var t=tasks[id];if(!t)return;
  t.title=document.getElementById('et')?.value.trim()||t.title;
  t.desc=document.getElementById('ed')?.value.trim()||'';
  t.prio=document.getElementById('ep')?.value||t.prio;
  var an=document.getElementById('ea')?.value||t.assignee;
  var assigneeObj=findRosterUser(an);
  t.assignee=an;t.assigneeUid=assigneeObj?.uid||assigneeObj?.rosterUid||assigneeObj?.firebaseUid||t.assigneeUid;
  t.col=document.getElementById('ecol')?.value||t.col;
  t.due=parseDue(document.getElementById('edu')?.value||'');
  t.done=t.col==='Done';
  saveTask(t);logAct('Task edited',`"${t.title}"`);closeModal();render();openDetail(id);
}
function doAddProj(){
  var name=document.getElementById('npn')?.value.trim();if(!name)return;
  var cid=document.getElementById('npcl')?.value;
  var cl=CLIENTS.find(c=>c.id===cid);
  if(cl&&!cl.projects.includes(name)){cl.projects.push(name);PCOLORS[name]=cl.color;ALL_PROJS.push(name);
    if(db)db.ref('nd_opsbot/clients/'+cid).set(cl);}
  logAct('Project created',name);closeModal();buildClientSidebar();render();
}
function doAddClient(){
  var name=document.getElementById('cn')?.value.trim();if(!name)return;
  var proj=document.getElementById('cp')?.value.trim()||'General';
  var id=name.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
  var c={id,name,color:'#777',projects:[proj]};
  CLIENTS.push(c);PCOLORS[proj]='#777';ALL_PROJS.push(proj);
  if(db)db.ref('nd_opsbot/clients/'+id).set(c);
  logAct('Client added',name);closeModal();buildClientSidebar();render();
}
function doAddMember(){
  var name=document.getElementById('mn')?.value.trim();if(!name)return;
  var email=document.getElementById('me')?.value.trim();if(!email){alert('Email required for login.');return;}
  var pass=document.getElementById('mp')?.value.trim()||'nd2024';
  var role=document.getElementById('mrl')?.value||'member';
  var dept=document.getElementById('md')?.value||'Operations';
  var ca=document.getElementById('mca')?.value.trim();
  var clients=ca?ca.split(',').map(x=>x.trim()).filter(Boolean):null;
  var ini=name.split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2);
  var uid=email.split('@')[0];
  var u={uid,name:name.trim(),fullName:name.trim(),email,role,dept,ini,color:'#888',bg:'#f0f0f0',pass,isAdmin:role==='admin'||role==='owner',clients,rosterUid:uid};
  // Create Firebase Auth user if online
  if(fbReady&&firebase.auth){
    firebase.auth().createUserWithEmailAndPassword(email,pass)
      .then(c=>{
        u.uid=c.user.uid;
        u.firebaseUid=c.user.uid;
        u.rosterUid=u.uid;
        if(db){
          return Promise.all([
            db.ref('nd_opsbot/users/'+u.uid).set(u),
            db.ref('nd_opsbot/usersByEmail/'+profileEmailKey(email)).set(u)
          ]).then(()=>u);
        }
        return u;
      })
      .then(()=>{
        if(db){
          syncRosterTree();
        }else{
          ROSTER.push(u);
          buildQuickUsers();
          buildClientSidebar();
          render();
        }
        logAct('Member added',`${name} (${role}, ${dept})`);
        closeModal();
      })
      .catch(e=>alert('Could not create login: '+e.message));
  }else{
    ROSTER.push(u);
    buildQuickUsers();
    buildClientSidebar();
    render();
    logAct('Member added',`${name} (${role}, ${dept})`);closeModal();
  }
}

function rChat(){
  var replyBarHtml='';

      </div>
      <button class="reply-bar-x" onclick="clearReply()" title="Cancel reply">✕</button>
    </div>`;
  }
  return`<div class="cw">
    <div class="c-hd">
      <div><h2>OpsBot AI</h2><p>Multi-action · assign · escalate · standup summaries · hover a message to ↩ reply</p></div>
      <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--gn2)">
        <div class="fb-dot" style="background:var(--gn2)"></div>API key secured
      </div>
    </div>
    <div class="msgs" id="msgs">${chatLocal.map((m,i)=>rMsg(m,i)).join('')}</div>
    <div class="c-in-wrap">
      ${replyBarHtml}
      <div class="c-in">
        <textarea class="c-ta" id="c-ta" placeholder="e.g. Assign DocMIQ to Nandika urgent due May 3… or hover a message and click ↩ to reply" onkeydown="ckd(event)"></textarea>
        <button class="c-sb" id="c-sb" onclick="sendChat()"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M14 8L2 2l3 6-3 6 12-6z" fill="#fff"/></svg></button>
      </div>
    </div>
  </div>`;
}
function setReply(idx){
  var m=chatLocal[idx];if(!m)return;
  replyTarget={role:m.role,name:m.role==='user'?(CU?.name||'You'):'OpsBot',text:m.text,idx};
  render();
  setTimeout(()=>{var ta=document.getElementById('c-ta');if(ta){ta.focus();}},50);
}
function clearReply(){
  replyTarget=null;
  var rb=document.getElementById('reply-bar');if(rb)rb.remove();
  // Re-render reply bar area without full render
  var wrap=document.querySelector('.c-in-wrap');if(wrap){var bar=wrap.querySelector('.reply-bar');if(bar)bar.remove();}
}
function rMsg(m,idx){
  // Render quoted message if this message is a reply
  var quoteBubble='';
  if(m.replyTo){
    quoteBubble=`<div class="m-quote" onclick="scrollToMsg(${m.replyTo.idx})">
      <div class="m-quote-nm">${m.replyTo.name}</div>
      <div class="m-quote-tx">${(m.replyTo.text||'').replace(/<[^>]+>/g,'').slice(0,100)}</div>
    </div>`;
  }
  var pills='';
  if(m.actions){m.actions.forEach(a=>{
    if(a.type==='task_created'||a.type==='task_updated'){
      var label=a.type==='task_created'?'✅ Task created':'✏ Task updated';
      var extraTags='';
      if(a.col)extraTags+=`<span class="tag t-inf">${a.col}</span>`;
      pills+=`<div class="ap"><strong>${label}</strong> ${a.title||''}
        <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:5px">
          ${a.prio?`<span class="tag t-${a.prio}">${a.prio}</span>`:''}
          ${a.assignee?`<span class="tag t-nor">${a.assignee}</span>`:''}
          ${a.project?`<span class="tag t-inf">${a.project}</span>`:''}
          ${a.due?`<span class="tag t-nor">${a.due}</span>`:''}
          ${extraTags}
        </div></div>`;
    }
    if(a.type==='escalation')pills+=`<div class="ep"><strong>🚨 Escalated</strong> ${a.title||''}</div>`;
  });}
  var idxAttr=idx!==undefined?` data-idx="${idx}"`:''
  return`<div class="msg msg-${m.role==='user'?'u':'b'}"${idxAttr}>
    <div class="m-av">${m.role==='user'?(CU?.ini||'U'):'N'}</div>
    <div class="m-bd">
      <div class="m-nm">${m.role==='user'?(CU?.name||'You'):'OpsBot'}</div>
      ${quoteBubble}
      <div class="m-tx">${m.text}</div>${pills}
    </div>
    ${idx!==undefined?`<button class="reply-btn" onclick="event.stopPropagation();setReply(${idx})" title="Reply to this message"><svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor"><path d="M7 3L1 8l6 5V9.5c3.5 0 6.5 1.5 8 4.5C15 9.5 12 4.5 7 4.5V3z"/></svg> Reply</button>`:''}
  </div>`;
}
function scrollToMsg(idx){
  var el=document.querySelector(`.msg[data-idx="${idx}"]`);
  if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.background='var(--am3)';setTimeout(()=>el.style.background='',1200);}
}
// API key is now stored in .env on the server — no client-side key needed
function scrollChat(){setTimeout(()=>{var e=document.getElementById('msgs');if(e)e.scrollTop=e.scrollHeight;},20);}
function ckd(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}}

async function sendChat(){
  var inp=document.getElementById('c-ta');if(!inp)return;
  var txt=inp.value.trim();if(!txt)return;
  inp.value='';
  var hist=chatLocal.slice(-10).map(x=>({role:x.role==='user'?'user':'assistant',content:x.text}));
  var msg={role:'user',text:txt,ts:Date.now()};
  if(replyTarget){msg.replyTo={name:replyTarget.name,text:replyTarget.text,idx:replyTarget.idx};}
  replyTarget=null;
  chatLocal.push(msg);
  saveMsg(msg);
  var msgs=document.getElementById('msgs');
  if(msgs){
    msgs.innerHTML+=rMsg({role:'user',text:txt});
    msgs.innerHTML+=`<div id="tmsg" class="msg msg-b"><div class="m-av">N</div><div class="m-bd"><div class="m-nm">OPSBOT</div><div class="m-tx"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div></div></div>`;
    msgs.scrollTop=msgs.scrollHeight;
  }
  var sb=document.getElementById('c-sb');if(sb)sb.disabled=true;

  var all=visibleTasks();
  var ctx=all.slice(0,40).map(t=>`[${t.id}] "${t.title}" uid:${t.assigneeUid} assign:${t.assignee} proj:${t.project} col:${t.col} prio:${t.prio} done:${t.done}${t.due?' due:'+t.due:''}${t.escalated?' ESC':''}`).join('\n');
  var loads=ROSTER.slice(0,8).map(u=>u.name+':'+all.filter(t=>t.assigneeUid===u.uid&&!t.done).length).join(', ');
  var ovList=all.filter(t=>isOD(t)).map(t=>'"'+t.title+'" ('+t.assignee+')').join(', ')||'None';
  var escList=all.filter(t=>isEsc(t)).map(t=>'"'+t.title+'"').join(', ')||'None';

  var SYS=`You are OpsBot, the AI operations assistant for Nextdot — an AI Engineering company.
Today: ${new Date().toDateString()}.
Current user: ${CU?.fullName} (${CU?.role}, ${CU?.dept}).
Team: ${ROSTER.map(u=>`${u.name}[${u.uid}] ${u.dept}/${u.role}`).join('; ')}.
Clients: ${CLIENTS.map(c=>c.name+'('+c.id+'): '+c.projects.join(',')).join('; ')}.
Workloads (open tasks): ${loads}.
Overdue: ${ovList}. Escalated: ${escList}.

Current tasks:\n${ctx}

RESPONSE FORMAT — always return valid JSON:
{"actions":[...], "reply":"..."}

ACTION TYPES (use as many as needed per request):
{"type":"create","title":"...","assignee":"Full Name","assigneeUid":"uid","project":"...","client":"id","dept":"...","prio":"urgent|today|normal","due":"Mon D","desc":"..."}
{"type":"done","id":"task_id","title":"task title for fallback"}
{"type":"move","id":"task_id","title":"task title for fallback","col":"Todo|In Progress|Review|Done"}
{"type":"priority","id":"task_id","title":"task title for fallback","prio":"urgent|today|normal"}
{"type":"deadline","id":"task_id","title":"task title for fallback","due":"Mon D"}
{"type":"reassign","id":"task_id","title":"task title for fallback","assignee":"Full Name","assigneeUid":"uid"}
{"type":"escalate","id":"task_id","title":"task title for fallback"}
{"type":"deescalate","id":"task_id","title":"task title for fallback"}
{"type":"delete","id":"task_id","title":"task title for fallback"}

CRITICAL RULES:
- ALWAYS include both "id" (exact task id from the list above e.g. t1, t6) AND "title" in every action.
- Status update phrases like "is in progress", "is done", "moved to review" → use type "move" with correct col.
- Priority change phrases like "make urgent", "set to today" → use type "priority".
- Always fill assigneeUid from the team list above.
- Warn in reply if assignee already has >4 open tasks.
- Escalation = urgent+overdue or explicit request = flag for Ayush.
- Be concise, confirm every action taken, suggest alternatives when overloaded.
For summaries/questions: {"actions":[],"reply":"..."}`;

  try{
    // API key lives in .env on the server — this call never exposes it
    var res=await fetch('/api/chat',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:700,system:SYS,messages:[...hist,{role:'user',content:txt}]})});
    var data=await res.json();
    if(data.error){finishChat('Error: '+data.error,[]);return;}
    var raw=((data.content&&data.content[0]&&data.content[0].text)||'').trim();
    var parsed=null;
    try{var jm=raw.match(/\{[\s\S]*\}/);if(jm)parsed=JSON.parse(jm[0]);}catch(e){}
    if(parsed&&Array.isArray(parsed.actions)){
      var done=[];

      // Robust task finder: try exact ID first, then fuzzy title match
      function findTask(a){
        if(a.id&&tasks[a.id])return tasks[a.id];
        // fallback: search by title fragment from action
        var needle=(a.title||a.id||'').toLowerCase().trim();
        if(!needle)return null;
        var all=Object.values(tasks);
        // exact title match first
        var ex=all.find(x=>x.title.toLowerCase()===needle);
        if(ex)return ex;
        // partial match — find best overlap
        var words=needle.split(/\s+/).filter(w=>w.length>3);
        if(!words.length)return null;
        var best=null,bestScore=0;
        all.forEach(x=>{
          var tl=x.title.toLowerCase();
          var score=words.filter(w=>tl.includes(w)).length;
          if(score>bestScore){bestScore=score;best=x;}
        });
        return bestScore>0?best:null;
      }

      parsed.actions.forEach(a=>{
        if(a.type==='create'){
          var id='t'+Date.now()+Math.random().toString(36).slice(2,5);
          var nt={id,title:a.title||'Untitled',desc:a.desc||'',prio:a.prio||'normal',done:false,
            assignee:a.assignee||CU?.name||'Unassigned',assigneeUid:a.assigneeUid||findRosterUser(a.assignee)?.uid||findRosterUser(a.assignee)?.rosterUid||findRosterUser(a.assignee)?.firebaseUid||'',
            project:a.project||ALL_PROJS[0],client:a.client||'internal',dept:a.dept||'Operations',
            col:'Todo',due:a.due||'',escalated:false,created:Date.now(),
            creator:CU?.name||'System',creatorUid:CU?.rosterUid||CU?.uid||''};
          saveTask(nt);logAct('AI created',`"${nt.title}" → ${nt.assignee}`);
          done.push({type:'task_created',title:nt.title,prio:nt.prio,assignee:nt.assignee,project:nt.project,due:nt.due});

        }else if(a.type==='done'){
          var t=findTask(a);
          if(t&&canSeeTask(t)){t.done=true;t.col='Done';saveTask(t);logAct('AI done',`"${t.title}"`);done.push({type:'task_updated',title:t.title});}

        }else if(a.type==='move'){
          var t=findTask(a);
          if(t&&canSeeTask(t)){
            t.col=a.col;t.done=(a.col==='Done');
            if(a.prio)t.prio=a.prio;  // allow combined move+priority
            saveTask(t);logAct('AI moved',`"${t.title}" → ${a.col}`);
            done.push({type:'task_updated',title:t.title,col:a.col});
          }

        }else if(a.type==='priority'){
          var t=findTask(a);
          if(t&&canSeeTask(t)){t.prio=a.prio||'normal';saveTask(t);logAct('AI priority',`"${t.title}" → ${t.prio}`);done.push({type:'task_updated',title:t.title,prio:t.prio});}

        }else if(a.type==='deadline'){
          var t=findTask(a);
          if(t&&canSeeTask(t)){t.due=a.due;saveTask(t);logAct('AI deadline',`"${t.title}" → ${a.due}`);done.push({type:'task_updated',title:t.title,due:a.due});}

        }else if(a.type==='reassign'){
          var t=findTask(a);
          if(t&&(perm('canSeeAll')||t.assigneeUid===(CU?.rosterUid||CU?.uid))){
            t.assignee=a.assignee;
            t.assigneeUid=a.assigneeUid||findRosterUser(a.assignee)?.uid||findRosterUser(a.assignee)?.rosterUid||findRosterUser(a.assignee)?.firebaseUid||t.assigneeUid;
            saveTask(t);logAct('AI reassigned',`"${t.title}" → ${a.assignee}`);
            done.push({type:'task_updated',title:t.title,assignee:a.assignee});
          }

        }else if(a.type==='escalate'){
          var t=findTask(a);
          if(t&&canSeeTask(t)){t.escalated=true;saveTask(t);logAct('AI escalated',`"${t.title}"`);done.push({type:'escalation',title:t.title});}

        }else if(a.type==='deescalate'){
          var t=findTask(a);
          if(t&&perm('canSeeAll')){t.escalated=false;saveTask(t);logAct('Escalation cleared',`"${t.title}"`);done.push({type:'task_updated',title:t.title});}

        }else if(a.type==='delete'&&perm('canDelete')){
          var t=findTask(a);
          if(t){logAct('AI deleted',`"${t.title}"`);removeTask(t.id);}
        }
      });
      finishChat(parsed.reply||'Done!',done);
    }else finishChat(raw||'Done!',[]);
  }catch(e){finishChat('Connection error. Check your API key.',[]); }
}
function finishChat(text,actions){
  var tm=document.getElementById('tmsg');if(tm)tm.remove();
  var sb=document.getElementById('c-sb');if(sb)sb.disabled=false;
  var botMsg={role:'bot',text,actions,ts:Date.now()};
  chatLocal.push(botMsg);
  saveMsg(botMsg);
  render();
}

buildQuickUsers();
initFB();
</script>
